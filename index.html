<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garage Agent™ | Autonomous Diagnostics</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0b132b; color: #ffffff; padding: 16px; line-height: 1.5; }
    .container { width: 100%; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1c2541; padding-bottom: 12px; }
    .brand { font-size: 1.2rem; font-weight: bold; color: #00d2ff; }
    .subbrand { font-size: 0.75rem; color: #8d99ae; }
    .badge-fsm { background: rgba(0, 210, 255, 0.1); color: #00d2ff; border: 1px solid #00d2ff; border-radius: 6px; padding: 4px 8px; font-size: 0.75rem; font-weight: bold; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .card { background: #1c2541; border: 1px solid #3a506b; border-radius: 10px; padding: 14px; }
    .card-sm { background: #1c2541; border: 1px solid #3a506b; border-radius: 8px; padding: 10px; text-align: center; }
    .telem-label { font-size: 0.65rem; color: #8d99ae; text-transform: uppercase; margin-bottom: 4px; }
    .telem-value { font-size: 1rem; font-weight: bold; }
    .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    label { font-size: 0.75rem; color: #8d99ae; }
    input { background: #0b132b; border: 1px solid #3a506b; color: #fff; padding: 10px; border-radius: 6px; font-size: 0.9rem; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    button { padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; font-size: 0.85rem; }
    button:active { opacity: 0.8; }
    .btn-connect { background: #6c5ce7; width: 100%; margin-bottom: 12px; }
    .btn-agent { background: #0081a7; }
    .btn-toggle { background: #118ab2; }
    .timeline { display: flex; flex-direction: column; gap: 8px; font-family: monospace; font-size: 0.75rem; }
    .timeline-entry { padding-bottom: 6px; border-bottom: 1px dashed #3a506b; color: #8d99ae; }
    .hypo-card { background: #0b132b; border-left: 3px solid #00d2ff; padding: 10px; margin-top: 8px; border-radius: 4px; }
    .hypo-desc { font-size: 0.75rem; color: #8d99ae; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Header Section -->
    <div class="header">
      <div>
        <div class="brand">🔧 Garage Agent™</div>
        <div class="subbrand">Project_Gifted1™ Autonomous AI Diagnostics</div>
      </div>
      <div class="badge-fsm">FSM Active</div>
    </div>

    <!-- Live Telemetry Grid -->
    <div class="grid-3">
      <div class="card-sm">
        <div class="telem-label">Battery</div>
        <div class="telem-value" style="color: #4edd85;">12.4 V</div>
      </div>
      <div class="card-sm">
        <div class="telem-label">Door State</div>
        <div class="telem-value" style="color: #ff5964;">LOCKED</div>
      </div>
      <div class="card-sm">
        <div class="telem-label">Fuel Press.</div>
        <div class="telem-value" style="color: #4edd85;">3.9 BAR</div>
      </div>
    </div>

    <!-- Telemetry & Commands Card -->
    <div class="card">
      <h3 style="font-size: 0.95rem; margin-bottom: 12px;">📋 Telemetry & Commands</h3>
      
      <!-- CLEAN SMARTCAR OAUTH URL -->
      <button class="btn-connect" onclick="window.location.href='https://connect.smartcar.com/oauth/authorize?response_type=code&client_id=client_01M005QGMRN80T4W3Q6MCFEK14&redirect_uri=https%3A%2F%2Fgarage-agent.gnfcw9w5rk.workers.dev%2Fauth%2Fcallback&scope=read_vehicle_info%20read_diagnostics%20control_security&mode=test'">
        🚘 Connect Real Vehicle (Smartcar)
      </button>

      <div class="input-group">
        <label>VIN / Vehicle ID</label>
        <input type="text" id="vin-input" value="1FA6P8CF0H1XXXXXX" readonly>
      </div>

      <div class="input-group">
        <label>Active DTC Codes</label>
        <input type="text" id="dtc-input" value="P0171, P0174">
      </div>

      <div class="btn-grid">
        <button class="btn-agent" onclick="runAgents()">🚀 Run Parallel Agents</button>
        <button class="btn-toggle" onclick="toggleLock()">🔒 Lock / Unlock</button>
      </div>
    </div>

    <!-- Diagnostic Hypotheses Output -->
    <div class="card">
      <h3 style="font-size: 0.95rem; margin-bottom: 8px;">🎯 Diagnostic Hypotheses</h3>
      <div id="hypotheses-container">
        <p style="font-size: 0.8rem; color: #8d99ae; text-align: center; padding: 12px;">Awaiting telemetry trigger...</p>
      </div>
    </div>

    <!-- Agent Audit Timeline -->
    <div class="card">
      <h3 style="font-size: 0.95rem; margin-bottom: 12px;">📜 Agent Audit Timeline</h3>
      <div class="timeline" id="timeline">
        <div class="timeline-entry">[INIT] Telematics listener standby mode active.</div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
