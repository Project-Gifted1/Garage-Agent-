<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garage Agent™ | Project_Gifted1™ Autonomous AI Diagnostics</title>
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #141c2e;
      --card-border: #232f48;
      --accent-blue: #00d2ff;
      --accent-purple: #6c5ce7;
      --text-main: #ffffff;
      --text-muted: #8c9ba5;
      --status-green: #00e676;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-blue);
      margin: 0;
    }

    .brand-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .btn-options {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .metric-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 1rem;
      font-weight: 700;
      color: var(--status-green);
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .panel-header {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-connect {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #7c4dff, #651fff);
      color: white;
      text-align: center;
      padding: 12px 0;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 16px;
      box-sizing: border-box;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-field {
      width: 100%;
      background: #0d1322;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text-main);
      font-family: monospace;
      font-size: 0.9rem;
      box-sizing: border-box;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .btn-action {
      background: #0091ea;
      border: none;
      color: white;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-secondary {
      background: #00838f;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1 class="brand-title">🔧 Garage Agent™</h1>
        <div class="brand-sub">Project_Gifted1™ Autonomous AI Diagnostics</div>
      </div>
      <button class="btn-options">⚙️ Options ▾</button>
    </header>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">Battery</div>
        <div class="metric-value">12.4 V</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Door State</div>
        <div class="metric-value">UNLOCKED</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Fuel Press.</div>
        <div class="metric-value">3.9 BAR</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">📋 Telemetry & Commands</div>
      
      <!-- Updated Live Smartcar Login Endpoint -->
      <a href="https://garage-agent-api.gnfcw9w5rk.workers.dev/login" class="btn-connect">
        🚗 Connect Vehicle (Smartcar)
      </a>

      <div class="input-group">
        <label>VIN / Vehicle ID</label>
        <input type="text" class="input-field" value="1FA6P8CF0H1XXXXXX" readonly />
      </div>

      <div class="input-group">
        <label>Active DTC Codes</label>
        <input type="text" class="input-field" value="P0171, P0174" readonly />
      </div>

      <div class="actions-grid">
        <button class="btn-action">🚀 Run Parallel Agents</button>
        <button class="btn-action btn-secondary">🔒 Lock / Unlock</button>
      </div>
    </div>
  </div>

</body>
</html>
