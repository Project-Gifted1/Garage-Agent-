<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garage Agent™ | Project_Gifted1™ Autonomous AI Diagnostics</title>
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #141c2e;
      --card-border: #232f48;
      --accent-blue: #00d2ff;
      --accent-purple: #6c5ce7;
      --text-main: #ffffff;
      --text-muted: #8c9ba5;
      --status-green: #00e676;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      position: relative;
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-blue);
      margin: 0;
    }

    .brand-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .options-wrapper {
      position: relative;
    }

    .btn-options {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Dropdown Menu Overlay */
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 6px;
      width: 220px;
      background: #101728;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      z-index: 100;
      overflow: hidden;
    }

    .dropdown-menu.show {
      display: block;
    }

    .dropdown-item {
      padding: 12px 14px;
      font-size: 0.85rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .dropdown-item.disabled {
      color: var(--text-muted);
      opacity: 0.6;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .metric-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 1rem;
      font-weight: 700;
      color: var(--status-green);
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .panel-header {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-connect {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #7c4dff, #651fff);
      color: white;
      text-align: center;
      padding: 12px 0;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 16px;
      box-sizing: border-box;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-field {
      width: 100%;
      background: #0d1322;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text-main);
      font-family: monospace;
      font-size: 0.9rem;
      box-sizing: border-box;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .btn-action {
      background: #0091ea;
      border: none;
      color: white;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-secondary {
      background: #00838f;
    }

    .status-log {
      margin-top: 12px;
      padding: 10px;
      background: #080d1a;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #60a5fa;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1 class="brand-title">🔧 Garage Agent™</h1>
        <div class="brand-sub">Project_Gifted1™ Autonomous AI Diagnostics</div>
      </div>
      <div class="options-wrapper">
        <button class="btn-options" onclick="toggleMenu(event)">⚙️ Options ▾</button>
        <div id="options-dropdown" class="dropdown-menu">
          <div class="dropdown-item">🟢 FSM Status: Active</div>
          <div class="dropdown-item disabled">🏎️ ECU Remapping (Beta)</div>
          <div class="dropdown-item disabled">📺 Repair Video Guides</div>
        </div>
      </div>
    </header>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">Battery</div>
        <div class="metric-value" id="val-battery">12.4 V</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Door State</div>
        <div class="metric-value" id="val-door">UNLOCKED</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Odometer</div>
        <div class="metric-value" id="val-odometer">-- km</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">📋 Telemetry & Commands</div>
      
      <a href="https://garage-agent-api.gnfcw9w5rk.workers.dev/login" class="btn-connect">
        🚗 Connect Vehicle (Smartcar)
      </a>

      <div class="input-group">
        <label>VIN / Vehicle ID</label>
        <input type="text" id="field-vin" class="input-field" value="1FA6P8CF0H1XXXXXX" readonly />
      </div>

      <div class="input-group">
        <label>Active DTC Codes</label>
        <input type="text" id="field-dtc" class="input-field" value="P0171, P0174" readonly />
      </div>

      <div class="actions-grid">
        <button class="btn-action" onclick="runAgents()">🚀 Run Parallel Agents</button>
        <button class="btn-action btn-secondary" onclick="toggleLock()">🔒 Lock / Unlock</button>
      </div>

      <div id="status-console" class="status-log"></div>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const vehicleId = params.get('vehicle_id');
      const odometer = params.get('odometer');
      const dtc = params.get('dtc');

      if (vehicleId) {
        document.getElementById('field-vin').value = vehicleId;
        logConsole(`Vehicle connected: ${vehicleId}`);
      }
      if (odometer) {
        document.getElementById('val-odometer').innerText = `${odometer} km`;
      }
      if (dtc) {
        document.getElementById('field-dtc').value = dtc;
      }
    });

    // Close menu when tapping anywhere outside
    document.addEventListener('click', (e) => {
      const dropdown = document.getElementById('options-dropdown');
      if (!e.target.closest('.options-wrapper')) {
        dropdown.classList.remove('show');
      }
    });

    function toggleMenu(e) {
      e.stopPropagation();
      const dropdown = document.getElementById('options-dropdown');
      dropdown.classList.toggle('show');
    }

    function logConsole(msg) {
      const consoleEl = document.getElementById('status-console');
      consoleEl.style.display = 'block';
      consoleEl.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
    }

    function runAgents() {
      logConsole('Initiating parallel diagnostic agents...');
      setTimeout(() => {
        logConsole('Agent analysis complete. Diagnostic payload synced.');
      }, 1500);
    }

    function toggleLock() {
      const doorEl = document.getElementById('val-door');
      const currentState = doorEl.innerText;
      const newState = currentState === 'UNLOCKED' ? 'LOCKED' : 'UNLOCKED';
      doorEl.innerText = newState;
      logConsole(`Vehicle command executed: ${newState}`);
    }
  </script>
</body>
</html>
