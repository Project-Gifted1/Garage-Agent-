<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Garage Agent™ - Autonomous AI Diagnostics</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b132b; color: #ffffff; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
    .brand { font-size: 1.2rem; font-weight: bold; color: #00d2ff; }
    .subbrand { font-size: 0.75rem; color: #a0aec0; }
    .badge-fsm { background: rgba(0, 210, 255, 0.1); color: #00d2ff; border: 1px solid #00d2ff; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; text-align: right; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .card { background: #1c2541; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px; }
    .card-sm { background: #1c2541; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 10px; text-align: center; }
    .telem-label { font-size: 0.65rem; color: #a0aec0; text-transform: uppercase; letter-spacing: 0.5px; }
    .telem-value { font-size: 1rem; font-weight: bold; margin-top: 4px; color: #38ef7d; }
    .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    label { font-size: 0.75rem; color: #a0aec0; }
    input { background: #0b132b; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.9rem; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 0.85rem; cursor: pointer; transition: opacity 0.2s; color: white; }
    button:active { opacity: 0.8; }
    .btn-agent { background: #0081a7; }
    .btn-toggle { background: #118ab2; }
    .timeline { display: flex; flex-direction: column; gap: 8px; font-family: monospace; font-size: 0.75rem; color: #a0aec0; max-height: 150px; overflow-y: auto; }
    .timeline-entry { padding-bottom: 4px; border-bottom: 1px dashed rgba(255,255,255,0.05); }
    .highlight { color: #00d2ff; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div>
        <div class="brand">🔧 Garage Agent™</div>
        <div class="subbrand">Project_Gifted1™ Autonomous AI Diagnostics</div>
      </div>
      <div class="badge-fsm">FSM<br>Active</div>
    </div>

    <!-- Telemetry Cards -->
    <div class="grid-3">
      <div class="card-sm">
        <div class="telem-label">Battery</div>
        <div class="telem-value">12.4 V</div>
      </div>
      <div class="card-sm">
        <div class="telem-label">Door State</div>
        <div id="door-state" class="telem-value" style="color: #ff4d4d;">LOCKED</div>
      </div>
      <div class="card-sm">
        <div class="telem-label">Fuel Press.</div>
        <div class="telem-value">3.9 BAR</div>
      </div>
    </div>

    <!-- Controls Card -->
    <div class="card">
      <h2 style="font-size: 1rem; margin-bottom: 12px;">📋 Telemetry & Commands</h2>
      <div class="input-group">
        <label>VIN</label>
        <input type="text" value="1FA6P8CF0H1XXXXXX" readonly>
      </div>
      <div class="input-group">
        <label>Active DTC Codes</label>
        <input type="text" value="P0171, P0174" readonly>
      </div>
      <div class="btn-grid">
        <button class="btn-agent" onclick="runParallelAgents()">🚀 Run Parallel Agents</button>
        <button id="lock-btn" class="btn-toggle" onclick="toggleDoorCommand()">🔒 Lock / Unlock</button>
      </div>
    </div>

    <!-- Hypotheses Card -->
    <div class="card">
      <h2 style="font-size: 1.1rem; margin-bottom: 12px;">🎯 Diagnostic Hypotheses</h2>
      <div id="hypothesis-container" style="color: #a0aec0; font-size: 0.85rem; text-align: center; padding: 12px;">
        Awaiting telemetry trigger...
      </div>
    </div>

    <!-- Audit Timeline -->
    <div class="card">
      <h2 style="font-size: 1rem; margin-bottom: 12px;">📜 Agent Audit Timeline</h2>
      <div id="audit-timeline" class="timeline">
        <div class="timeline-entry"><span class="highlight">[INIT]</span> Telematics listener standby mode active.</div>
      </div>
    </div>
  </div>

  <script>
    // Live Cloudflare Worker Base API URL
    const API_BASE_URL = "https://garage-agent.gnfcw9w5rk.workers.dev";
    let isCurrentlyLocked = true;

    // Timeline Helper
    function addAuditLog(message) {
      const timeline = document.getElementById('audit-timeline');
      const timeStr = new Date().toLocaleTimeString('en-US', { hour12: false });
      const entry = document.createElement('div');
      entry.className = 'timeline-entry';
      entry.innerHTML = `<span class="highlight">[${timeStr}]</span> ${message}`;
      if (timeline) {
        timeline.prepend(entry);
      }
    }

    // Cellular Door Lock / Unlock Control
    async function toggleDoorCommand() {
      const targetCommand = isCurrentlyLocked ? 'unlock' : 'lock';
      try {
        const response = await fetch(`${API_BASE_URL}/api/command`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command: targetCommand, vin: '1FA6P8CF0H1XXXXXX' })
        });

        const data = await response.json();

        if (data.success) {
          const doorBadge = document.getElementById('door-state');
          if (doorBadge) {
            doorBadge.textContent = data.doorState;
            doorBadge.style.color = data.doorState === 'LOCKED' ? '#ff4d4d' : '#38ef7d';
          }
          isCurrentlyLocked = (data.doorState === 'LOCKED');
          addAuditLog(data.log);
        }
      } catch (error) {
        console.error("API Command Error:", error);
      }
    }

    // Parallel Diagnostic Agent Execution
    async function runParallelAgents() {
      try {
        const response = await fetch(`${API_BASE_URL}/api/diagnose`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dtcCodes: ['P0171', 'P0174'] })
        });

        const data = await response.json();

        const container = document.getElementById('hypothesis-container');
        if (container) {
          container.innerHTML = `
            <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; border-left: 3px solid #00d2ff; text-align: left;">
              <div style="font-weight: bold; font-size: 1rem; color: #ffffff;">${data.hypothesis} (${data.confidence}% confidence)</div>
              <div style="font-size: 0.85rem; color: #a0aec0; margin-top: 6px;">${data.action}</div>
            </div>
          `;
        }

        addAuditLog(`Hypothesis rendered: ${data.hypothesis} (${data.confidence}% confidence).`);
      } catch (error) {
        console.error("API Diagnostic Error:", error);
      }
    }
  </script>
</body>
</html>
