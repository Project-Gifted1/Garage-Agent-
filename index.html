<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garage Agent - Diagnostic Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 1.5rem; margin: 0; }
    .card { background: #1e293b; padding: 1.5rem; border-radius: 12px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    h2 { margin-top: 0; color: #38bdf8; font-size: 1.4rem; }
    p { color: #94a3b8; font-size: 0.95rem; }
    .btn-group { display: flex; gap: 10px; margin: 1.5rem 0; }
    button { flex: 1; padding: 0.8rem 1rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: background 0.2s; }
    .btn-primary { background: #0284c7; color: white; }
    .btn-primary:hover { background: #0369a1; }
    .btn-success { background: #16a34a; color: white; }
    .btn-success:hover { background: #15803d; }
    pre { background: #020617; padding: 1rem; border-radius: 8px; overflow-x: auto; color: #38bd27; font-family: monospace; font-size: 0.85rem; border: 1px solid #334155; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Garage Agent™ Operations Panel</h2>
    <p>Status: Multi-Agent Telematics Engine Active</p>
    
    <div class="btn-group">
      <button class="btn-primary" onclick="runDiagnostics()">Run Diagnostics</button>
      <button class="btn-success" onclick="unlockVehicle()">Remote Unlock</button>
    </div>

    <h3>Output Stream:</h3>
    <pre id="output">System Initialized. Ready for telematics input...</pre>
  </div>

  <script src="app.js"></script>
</body>
</html>
